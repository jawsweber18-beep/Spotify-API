# Replace spotify-queues.duckdns.org with whatever DuckDNS hostname you register.
# Install this as /etc/apache2/sites-available/spotify-queues.conf, then:
#   sudo a2ensite spotify-queues.conf
#   sudo systemctl reload apache2
#   sudo certbot --apache -d spotify-queues.duckdns.org
# certbot will rewrite this file to add the :443 block + HTTP->HTTPS redirect,
# the same way it already did for your existing site.

<VirtualHost *:80>
    ServerName spotify-queues.duckdns.org

    DocumentRoot /opt/spotify-queues/client/dist
    <Directory /opt/spotify-queues/client/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8888/api
    ProxyPassReverse /api http://127.0.0.1:8888/api
    ProxyPass /auth http://127.0.0.1:8888/auth
    ProxyPassReverse /auth http://127.0.0.1:8888/auth

    ErrorLog ${APACHE_LOG_DIR}/spotify-queues-error.log
    CustomLog ${APACHE_LOG_DIR}/spotify-queues-access.log combined
</VirtualHost>
